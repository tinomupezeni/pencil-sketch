services:
  pencil-sketch:
    build:
      context: .
      dockerfile: Dockerfile
    image: pencil-sketch:local
    container_name: pencil-sketch
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
